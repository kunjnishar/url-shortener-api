<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shorten Engine | High-Performance URL Shortener</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(17, 24, 39, 0.75);
      --border: rgba(255, 255, 255, 0.08);
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --accent-glow: rgba(59, 130, 246, 0.35);
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.08) 0px, transparent 50%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .container {
      width: 100%;
      max-width: 540px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.5rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .badge-row {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .badge {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 9999px;
      background: rgba(59, 130, 246, 0.12);
      color: #93c5fd;
      border: 1px solid rgba(59, 130, 246, 0.25);
      letter-spacing: 0.02em;
    }

    h1 {
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .input-wrapper {
      position: relative;
    }

    input[type="url"] {
      width: 100%;
      padding: 14px 16px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    input[type="url"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    input[type="url"]::placeholder {
      color: #64748b;
    }

    button.btn-primary {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: #fff;
      font-weight: 600;
      font-size: 0.95rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
    }

    button.btn-primary:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }

    button.btn-primary:active {
      transform: translateY(0);
    }

    #result-card {
      display: none;
      margin-top: 1.75rem;
      padding: 1.25rem;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .result-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
      font-weight: 700;
    }

    .link-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.25);
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      margin-bottom: 1rem;
    }

    .short-url-text {
      color: #60a5fa;
      font-weight: 600;
      text-decoration: none;
      font-size: 1rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-right: 10px;
    }

    .short-url-text:hover {
      text-decoration: underline;
    }

    .btn-copy {
      background: rgba(255, 255, 255, 0.08);
      color: #e2e8f0;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
      white-space: nowrap;
    }

    .btn-copy:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .analytics-panel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .stat-item {
      display: flex;
      flex-direction: column;
    }

    .stat-label {
      font-size: 0.72rem;
      color: #64748b;
      margin-bottom: 2px;
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 1.1rem;
      font-weight: 700;
      color: #f1f5f9;
    }

    .refresh-btn {
      grid-column: span 2;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      padding: 8px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: all 0.2s ease;
    }

    .refresh-btn:hover {
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
    }

    footer {
      margin-top: 2rem;
      text-align: center;
      font-size: 0.8rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <div class="header">
        <div class="badge-row">
          <span class="badge">Base62 Encoding</span>
          <span class="badge">Atomic F() Expressions</span>
          <span class="badge">B-Tree Indexed</span>
        </div>
        <h1>Shorten Engine</h1>
        <p class="subtitle">Production-grade URL shortener with low-latency redirection and atomic metric tracking.</p>
      </div>

      <div class="form-group">
        <div class="input-wrapper">
          <input 
            type="url" 
            id="longUrl" 
            placeholder="Paste your long link here (e.g. https://github.com/...)" 
            autocomplete="off"
            required 
          />
        </div>
        <button class="btn-primary" id="submitBtn" onclick="handleShorten()">
          Shorten URL
        </button>
      </div>

      <div id="result-card">
        <div class="result-header">
          <span class="result-title">Generated Short Link</span>
        </div>

        <div class="link-row">
          <a id="shortUrlLink" class="short-url-text" href="#" target="_blank"></a>
          <button class="btn-copy" id="copyBtn" onclick="copyToClipboard()">Copy</button>
        </div>

        <div class="analytics-panel">
          <div class="stat-item">
            <span class="stat-label">Short Code</span>
            <span class="stat-value" id="statCode">—</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Total Clicks</span>
            <span class="stat-value" id="statClicks">0</span>
          </div>
          <button class="refresh-btn" onclick="refreshAnalytics()">↻ Refresh Live Click Count</button>
        </div>
      </div>
    </div>

    <footer>
      Engineered with Python 3.14 & Django REST Framework
    </footer>
  </div>

  <script>
    let currentShortCode = null;

    async function handleShorten() {
      const urlInput = document.getElementById('longUrl');
      const submitBtn = document.getElementById('submitBtn');
      const longUrl = urlInput.value.trim();

      if (!longUrl) {
        alert('Please enter a valid URL.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = 'Encoding slug...';

      try {
        const response = await fetch('/api/shorten/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ original_url: longUrl })
        });

        const data = await response.json();

        if (response.ok) {
          currentShortCode = data.short_code;
          
          document.getElementById('result-card').style.display = 'block';
          const linkElem = document.getElementById('shortUrlLink');
          linkElem.href = data.short_url;
          linkElem.innerText = data.short_url;
          
          document.getElementById('statCode').innerText = data.short_code;
          document.getElementById('statClicks').innerText = data.clicks;
        } else {
          alert('Submission error: ' + JSON.stringify(data));
        }
      } catch (err) {
        alert('Failed to connect to API server.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Shorten URL';
      }
    }

    function copyToClipboard() {
      const linkText = document.getElementById('shortUrlLink').innerText;
      const copyBtn = document.getElementById('copyBtn');
      
      navigator.clipboard.writeText(linkText).then(() => {
        copyBtn.innerText = 'Copied!';
        setTimeout(() => { copyBtn.innerText = 'Copy'; }, 2000);
      });
    }

    async function refreshAnalytics() {
      if (!currentShortCode) return;
      try {
        const response = await fetch(`/api/analytics/${currentShortCode}/`);
        const data = await response.json();
        if (response.ok) {
          document.getElementById('statClicks').innerText = data.clicks;
        }
      } catch (err) {
        console.error('Failed to refresh stats:', err);
      }
    }
  </script>
</body>
</html>
